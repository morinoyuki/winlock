# winlock 配置文件 (修改后执行 ./winlock.sh restart 或 winlock.bat restart 生效)
#
# game_exe     目标游戏的 Windows 可执行文件名, 含 .exe, 不区分大小写。
#              支持多个游戏, 两种写法:
#                1) 多写几行 game_exe, 每行一个游戏
#                2) 一行内用英文逗号(,)或竖线(|)分隔, 如: game_exe = a.exe, b.exe
#              未写 .exe 后缀会自动补上 (dota2 -> dota2.exe)
# window_title 可选: 窗口标题包含的子串(对全部游戏生效), 留空则只按进程名判断
# poll_ms      前台窗口检测间隔(毫秒)
# run_as_admin 1=以管理员权限运行。**当游戏是右键“以管理员身份运行”时必须要设置为 1**,
#              否则键盘钩子收不到管理员游戏的消息, 按键拦截会静默失效。
#              开启后每次启动会弹出一次 UAC 授权框, 确认即自动以管理员身份运行。
#              状态文件里的 elevated=1 表示本次确认已生效。
#
# 示例 —— 拦截艾尔登法环 和 暗黑破坏神4:
#   game_exe = eldenring.exe
#   game_exe = diablo4.exe
#   或: game_exe = eldenring.exe, diablo4.exe

game_exe = eldenring.exe
game_exe = diablo4.exe
window_title =
poll_ms = 300
run_as_admin = 0